<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHAMGAD VAALE</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        html, body { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        
        #display-container { flex: 1; padding: 8px; display: flex; flex-direction: column; border-bottom: 2px solid #333; min-height: 0; }
        .list-header { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.75rem; color: #666; border-bottom: 1px solid #222; padding-bottom: 2px; }
        #items-area { flex: 1; overflow-y: auto; font-family: monospace; font-size: 1.1rem; margin-bottom: 5px; }
        .item-row { display: grid; grid-template-columns: 1fr 1fr; padding: 2px 0; border-bottom: 1px solid #111; }
        .tag-val { color: #888; text-align: left; }
        .disc-val { color: #fff; text-align: right; font-weight: bold; }
        
        #live-summary { display: flex; justify-content: space-between; font-size: 0.9rem; color: #ff9f0a; padding: 4px 0; border-top: 1px solid #333; font-weight: bold; }
        #main-display { font-size: 3.2rem; font-weight: bold; color: #fff; text-align: right; line-height: 1; margin-top: 2px; }

        .grid { flex: 0 0 55%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; padding: 6px; background: #000; }
        button { border: none; border-radius: 6px; font-size: 1.4rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num { background-color: #2c2c2e; color: #fff; }
        .op { background-color: #3a3a3c; color: #ff9f0a; }
        .spec { background-color: #636366; color: #fff; }
        .eq { background-color: #ff9f0a; color: #fff; }
        .eq.saved { background-color: #34c759 !important; }
        
        .btn-print { font-size: 0.85rem; }
        .btn-net { background-color: #3a3a3c; color: #fff; }
        .btn-net-as-disc { background-color: #007aff !important; color: #fff !important; }
        .btn-history { background-color: #636366; color: #fff; }
        
        #p-status { background-color: #ff3b30; color: #fff; border-radius: 50%; height: 42px; width: 42px; margin: auto; font-size: 0.8rem; }
        #p-status.connected { background-color: #34c759; }

        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .popup-content { background: #1c1c1e; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 420px; border: 1px solid #333; }
        .popup-title { color: #fff; margin-top: 0; margin-bottom: 20px; font-size: 22px; }

        .salesman-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .salesman-btn { padding: 18px 10px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #000; }
        .sm-rahul { background-color: #FFEB3B; } .sm-suresh { background-color: #FF9800; } .sm-rajesh { background-color: #00BCD4; } 
        .sm-gulab { background-color: #9C27B0; color: #fff; } .sm-himakshi { background-color: #FF1493; color: #fff; } 
        .sm-mehak { background-color: #FFB6C1; } .sm-other { background-color: #90A4AE; } 

        .payment-grid { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .btn-green { background: #34c759; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; flex: 1; cursor: pointer;}
        .btn-red { background: #ff3b30; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; flex: 1; cursor: pointer;}
    </style>
</head>
<body>

    <div id="salesman-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h2 class="popup-title">Select Salesman</h2>
            <div id="salesman-grid" class="salesman-grid"></div>
        </div>
    </div>

    <div id="payment-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h2 class="popup-title">Payment Received?</h2>
            <div class="payment-grid">
                <button class="btn-green" onclick="finalizeBill('PAID')">YES (PAID)</button>
                <button class="btn-red" onclick="finalizeBill('UNPAID')">NO (UNPAID)</button>
            </div>
        </div>
    </div>

    <div id="display-container">
        <div class="list-header"><span>TAG ITEMS</span><span style="text-align: right;">DISCOUNTED</span></div>
        <div id="items-area"></div>
        <div id="live-summary">
            <span id="screen-tag-total">TAG: 0</span>
            <span id="screen-disc-total">DISC: 0</span>
        </div>
        <div id="main-display">0</div>
    </div>

    <div class="grid">
        <button class="spec" onclick="acButtonLogic()">AC</button>
        <button class="spec" onclick="backspace()">⌫</button>
        <button class="op" onclick="setOp('%')">%</button>
        <button class="op" onclick="setOp('*')">×</button>
        <button class="num" onclick="press('7')">7</button>
        <button class="num" onclick="press('8')">8</button>
        <button class="num" onclick="press('9')">9</button>
        <button class="op" onclick="setOp('-')">−</button>
        <button class="num" onclick="press('4')">4</button>
        <button class="num" onclick="press('5')">5</button>
        <button class="num" onclick="press('6')">6</button>
        <button class="op" onclick="setOp('+')">+</button>
        <button class="num" onclick="press('1')">1</button>
        <button class="num" onclick="press('2')">2</button>
        <button class="num" onclick="press('3')">3</button>
        <button class="btn-print btn-net" id="btn-net" onclick="netButtonLogic()">NET</button>
        <button id="p-status" onclick="connectBT()">P</button>
        <button class="num" onclick="press('0')">0</button>
        <button class="eq" id="eq-btn" onclick="calculate()">=</button>
        <button class="btn-print btn-history" onclick="copyHistory()">HIST</button>
    </div>

    <script>
        let currentInput = "", tagItems = [], discItems = [], isDiscPhase = false, lastOp = "+", btCharacteristic = null;
        let billNumber = parseInt(localStorage.getItem('shamgad_bill_no')) || 1, hasPrintedThisBill = false, currentSalesman = null, pendingPrintMode = null;

        const staffList = [{name:"Rahul",class:"sm-rahul"},{name:"Suresh",class:"sm-suresh"},{name:"Rajesh",class:"sm-rajesh"},{name:"Gulab",class:"sm-gulab"},{name:"Himakshi",class:"sm-himakshi"},{name:"Mehak",class:"sm-mehak"},{name:"Other",class:"sm-other"}];
        const grid = document.getElementById("salesman-grid");
        staffList.forEach(s => { let b = document.createElement("button"); b.className = `salesman-btn ${s.class}`; b.innerText = s.name; b.onclick = () => selectSalesman(s.name); grid.appendChild(b); });

        function updateUI() {
            const area = document.getElementById('items-area'); area.innerHTML = "";
            for(let i=0; i < Math.max(tagItems.length, discItems.length); i++) {
                area.innerHTML += `<div class="item-row"><div class="tag-val">${tagItems[i] || ''}</div><div class="disc-val">${discItems[i] || ''}</div></div>`;
            }
            document.getElementById('screen-tag-total').innerText = "TAG: " + tagItems.reduce((a, b) => a + b, 0);
            document.getElementById('screen-disc-total').innerText = "DISC: " + discItems.reduce((a, b) => a + b, 0);
        }

        function press(n) { currentInput += n; document.getElementById('main-display').innerText = currentInput; }
        function backspace() { currentInput = currentInput.slice(0, -1); document.getElementById('main-display').innerText = currentInput || "0"; }
        function processMath() {
            if (currentInput === "") return;
            let val = parseFloat(currentInput);
            if (isDiscPhase) discItems.push(lastOp === '%' ? Math.round((tagItems.pop() || 0) * (val/100)) : val);
            else tagItems.push(val);
            currentInput = "";
        }
        function setOp(op) { processMath(); lastOp = op; updateUI(); document.getElementById('main-display').innerText = "0"; }
        function calculate() { processMath(); updateUI(); lastOp = "+"; document.getElementById('main-display').innerText = "0"; if(!isDiscPhase && tagItems.length > 0) { isDiscPhase = true; document.getElementById('eq-btn').classList.add('saved'); document.getElementById('btn-net').innerText = "DISC"; document.getElementById('btn-net').classList.add('btn-net-as-disc'); } }
        
        function netButtonLogic() { if(!hasPrintedThisBill) { pendingPrintMode = isDiscPhase ? "DISC" : "NET"; document.getElementById("salesman-popup").style.display = "flex"; } else handlePrint(isDiscPhase ? "DISC" : "NET"); }
        function selectSalesman(name) { currentSalesman = name; hasPrintedThisBill = true; document.getElementById("salesman-popup").style.display = "none"; handlePrint(pendingPrintMode); }
        
        function finalizeBill(status) { if(hasPrintedThisBill) { billNumber++; localStorage.setItem('shamgad_bill_no', billNumber); } clearAll(); document.getElementById("payment-popup").style.display = "none"; }
        function acButtonLogic() { if(hasPrintedThisBill || tagItems.length > 0) document.getElementById("payment-popup").style.display = "flex"; else clearAll(); }
        function clearAll() { currentInput = ""; tagItems = []; discItems = []; isDiscPhase = false; hasPrintedThisBill = false; currentSalesman = null; document.getElementById('main-display').innerText = "0"; document.getElementById('eq-btn').classList.remove('saved'); document.getElementById('btn-net').innerText = "NET"; document.getElementById('btn-net').classList.remove('btn-net-as-disc'); updateUI(); }
        
        async function connectBT() { try { const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] }); const s = await d.gatt.connect(); const chars = await s.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb').then(srv => srv.getCharacteristics()); btCharacteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse); if(btCharacteristic) document.getElementById('p-status').classList.add('connected'); } catch(e) { alert(e.message); } }

        async function handlePrint(mode) {
            if(currentInput !== "") calculate();
            if(!btCharacteristic) { alert("Connect Printer"); return; }
            let text = `\x1B\x61\x01\x1D\x21\x11SHAMGAD VAALE\nBAJAJ\n\x1D\x21\x00BILL NO: ${billNumber}\nATTENDED BY: ${currentSalesman}\n--------------------------------\n\x1B\x61\x00\x1D\x21\x11`;
            if(mode === 'DISC') { for(let i=0; i<Math.max(tagItems.length, discItems.length); i++) text += `${tagItems[i]||0} - ${discItems[i]||0}\n`; }
            else { tagItems.forEach(p => text += `${p}\n`); }
            text += `\nTOTAL: ${tagItems.reduce((a,b)=>a+b,0)}\n--------------------------------\n\n\n\n`;
            const data = new TextEncoder().encode(text);
            for(let i=0; i<data.length; i+=20) await btCharacteristic.writeValue(data.slice(i, i+20));
            
            // Clear only the discount section
            discItems = [];
            updateUI();
        }
        function copyHistory() { navigator.clipboard.writeText(document.documentElement.outerHTML).then(() => alert("Copied!")); }
    </script>
</body>
</html>
