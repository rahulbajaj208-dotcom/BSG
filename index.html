<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHAMGAD VAALE</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        html, body { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        
        #display-container { flex: 1; padding: 8px; display: flex; flex-direction: column; border-bottom: 2px solid #333; min-height: 0; }
        .list-header { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.75rem; color: #666; border-bottom: 1px solid #222; padding-bottom: 2px; }
        #items-area { flex: 1; overflow-y: auto; font-family: monospace; font-size: 1.1rem; margin-bottom: 5px; }
        .item-row { display: grid; grid-template-columns: 1fr 1fr; padding: 2px 0; border-bottom: 1px solid #111; }
        .tag-val { color: #888; text-align: left; }
        .disc-val { color: #fff; text-align: right; font-weight: bold; }
        
        #live-summary { display: flex; justify-content: space-between; font-size: 0.9rem; color: #ff9f0a; padding: 4px 0; border-top: 1px solid #333; font-weight: bold; }
        #main-display { font-size: 3.2rem; font-weight: bold; color: #fff; text-align: right; line-height: 1; margin-top: 2px; }

        .grid { flex: 0 0 55%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; padding: 6px; background: #000; }
        button { border: none; border-radius: 6px; font-size: 1.4rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .num { background-color: #2c2c2e; color: #fff; }
        .op { background-color: #3a3a3c; color: #ff9f0a; }
        .spec { background-color: #636366; color: #fff; }
        .eq { background-color: #ff9f0a; color: #fff; }
        .eq.saved { background-color: #34c759 !important; }
        .btn-print { font-size: 0.85rem; }
        .btn-net { background-color: #3a3a3c; color: #fff; }
        .btn-disc { background-color: #007aff; color: #fff; }
        #p-status { background-color: #ff3b30; color: #fff; border-radius: 50%; height: 42px; width: 42px; margin: auto; font-size: 0.8rem; }
        #p-status.connected { background-color: #34c759; }

        /* Popup Styles */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .popup-content { background: #1c1c1e; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 420px; border: 1px solid #333; }
        .salesman-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .salesman-btn { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="salesman-popup" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <h2 style="margin-top: 0;">ATTENDED BY</h2>
            <div id="salesman-grid" class="salesman-grid"></div>
        </div>
    </div>

    <div id="display-container">
        <div class="list-header"><span>TAG ITEMS</span><span style="text-align: right;">DISCOUNTED</span></div>
        <div id="items-area"></div>
        <div id="live-summary">
            <span id="screen-tag-total">TAG: 0</span>
            <span id="screen-disc-total">DISC: 0</span>
        </div>
        <div id="main-display">0</div>
    </div>

    <div class="grid">
        <button class="spec" onclick="clearAll()">AC</button>
        <button class="spec" onclick="backspace()">⌫</button>
        <button class="op" onclick="setOp('%')">%</button>
        <button class="op" onclick="setOp('*')">×</button>
        <button class="num" onclick="press('7')">7</button>
        <button class="num" onclick="press('8')">8</button>
        <button class="num" onclick="press('9')">9</button>
        <button class="op" onclick="setOp('-')">−</button>
        <button class="num" onclick="press('4')">4</button>
        <button class="num" onclick="press('5')">5</button>
        <button class="num" onclick="press('6')">6</button>
        <button class="op" onclick="setOp('+')">+</button>
        <button class="num" onclick="press('1')">1</button>
        <button class="num" onclick="press('2')">2</button>
        <button class="num" onclick="press('3')">3</button>
        <button class="btn-print btn-net" onclick="requestSalesman('NET')">NET</button>
        <button id="p-status" onclick="connectBT()">P</button>
        <button class="num" onclick="press('0')">0</button>
        <button class="eq" id="eq-btn" onclick="calculate()">=</button>
        <button class="btn-print btn-disc" onclick="requestSalesman('DISC')">DISC</button>
    </div>

    <script>
        let currentInput = "", tagItems = [], discItems = [], isDiscPhase = false, lastOp = "+", btCharacteristic = null;
        let billNumber = parseInt(localStorage.getItem('shamgad_bill_no')) || 1;
        let pendingMode = null;

        const staff = ["Rahul", "Suresh", "Rajesh", "Gulab", "Himakshi", "Mehak", "Other"];
        const grid = document.getElementById("salesman-grid");
        staff.forEach(name => {
            let b = document.createElement("button");
            b.className = "salesman-btn";
            b.innerText = name;
            b.onclick = () => finalizePrint(name);
            grid.appendChild(b);
        });

        function numberToWords(num) {
            const a = ['','ONE ','TWO ','THREE ','FOUR ', 'FIVE ','SIX ','SEVEN ','EIGHT ','NINE ','TEN ','ELEVEN ','TWELVE ','THIRTEEN ','FOURTEEN ','FIFTEEN ','SIXTEEN ','SEVENTEEN ','EIGHTEEN ','NINETEEN '];
            const b = ['', '', 'TWENTY ','THIRTY ','FORTY ','FIFTY ', 'SIXTY ','SEVENTY ','EIGHTY ','NINETY '];
            if (num === 0) return 'ZERO ONLY';
            if (num > 99999) return num.toString();
            let str = '';
            if (Math.floor(num / 1000) > 0) {
                let thousands = Math.floor(num / 1000);
                str += (thousands < 20) ? a[thousands] : b[Math.floor(thousands / 10)] + a[thousands % 10];
                str += 'THOUSAND ';
                num %= 1000;
            }
            if (Math.floor(num / 100) > 0) { str += a[Math.floor(num / 100)] + 'HUNDRED '; num %= 100; }
            if (num > 0) { str += (num < 20) ? a[num] : b[Math.floor(num / 10)] + a[num % 10]; }
            return str.trim() + ' ONLY';
        }

        function updateUI() {
            const area = document.getElementById('items-area');
            area.innerHTML = "";
            for(let i=0; i < Math.max(tagItems.length, discItems.length); i++) {
                area.innerHTML += `<div class="item-row"><div class="tag-val">${tagItems[i]||''}</div><div class="disc-val">${discItems[i]||''}</div></div>`;
            }
            document.getElementById('screen-tag-total').innerText = "TAG: " + tagItems.reduce((a, b) => a + b, 0);
            document.getElementById('screen-disc-total').innerText = "DISC: " + discItems.reduce((a, b) => a + b, 0);
        }

        function press(num) { currentInput += num; document.getElementById('main-display').innerText = currentInput; }
        function backspace() { currentInput = currentInput.slice(0, -1); document.getElementById('main-display').innerText = currentInput || "0"; }
        
        function processMath() {
            if (currentInput === "") return;
            let val = parseFloat(currentInput);
            if (isDiscPhase) discItems.push(lastOp === '%' ? Math.round((tagItems[discItems.length] || 0) * (val/100)) : val);
            else tagItems.push(val);
            currentInput = "";
        }

        function setOp(op) { processMath(); lastOp = op; updateUI(); document.getElementById('main-display').innerText = "0"; }
        function calculate() { processMath(); updateUI(); lastOp = "+"; document.getElementById('main-display').innerText = "0"; if(!isDiscPhase && tagItems.length > 0) { isDiscPhase = true; document.getElementById('eq-btn').classList.add('saved'); } }
        function clearAll() { currentInput = ""; tagItems = []; discItems = []; isDiscPhase = false; document.getElementById('main-display').innerText = "0"; document.getElementById('eq-btn').classList.remove('saved'); updateUI(); }
        
        function requestSalesman(mode) { pendingMode = mode; document.getElementById("salesman-popup").style.display = "flex"; }

        async function connectBT() {
            try {
                const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
                const chars = await service.getCharacteristics();
                btCharacteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (btCharacteristic) document.getElementById('p-status').classList.add('connected');
            } catch (e) { alert(e.message); }
        }

        async function finalizePrint(salesman) {
            document.getElementById("salesman-popup").style.display = "none";
            if (currentInput !== "") calculate();
            if (!btCharacteristic) { alert("Connect Printer"); return; }
            const ESC = '\x1B', GS = '\x1D', CENTER = ESC + 'a' + '\x01', LEFT = ESC + 'a' + '\x00', SIZE_L = GS + '!' + '\x11', SIZE_N = GS + '!' + '\x00';
            let text = CENTER + SIZE_L + "SHAMGAD VAALE\nBAJAJ\n" + SIZE_N + `BILL NO: ${billNumber} | ${new Date().toLocaleDateString('en-IN')}\nATTENDED BY: ${salesman}\n--------------------------------\n` + LEFT + SIZE_L;

            if (pendingMode === 'DISC') {
                for(let i=0; i<Math.max(tagItems.length, discItems.length); i++) text += `${String(i+1).padStart(2, ' ')}: ${String(tagItems[i]||0).padStart(5, ' ')}-${String(discItems[i]||0).padStart(5, ' ')}\n`;
                text += SIZE_N + "--------------------------------\n" + SIZE_L + `TOTAL: ${tagItems.reduce((a,b)=>a+b,0)} - ${discItems.reduce((a,b)=>a+b,0)}\nNET: ${numberToWords(discItems.reduce((a,b)=>a+b,0))}\n`;
            } else {
                tagItems.forEach((p, i) => text += `${String(i+1).padStart(2, ' ')}: ${String(p).padStart(5, ' ')}\n`);
                text += SIZE_N + "--------------------------------\n" + SIZE_L + `TOTAL: ${tagItems.reduce((a,b)=>a+b,0)}\nNET: ${numberToWords(tagItems.reduce((a,b)=>a+b,0))}\n`;
            }
            text += SIZE_N + CENTER + "--------------------------------\nNO RETURN NO EXCHANGE\nTHANK YOU VISIT AGAIN\n\n\n\n\n";
            const data = new TextEncoder().encode(text);
            for (let i = 0; i < data.length; i += 20) await btCharacteristic.writeValue(data.slice(i, i + 20));
            
            billNumber++; localStorage.setItem('shamgad_bill_no', billNumber);
            discItems = []; // Clear only discount section
            updateUI();
        }
    </script>
</body>
</html>
